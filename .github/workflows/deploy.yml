# Publishes every prototype (protótipos/protótipo_N) to GitHub Pages on every push to main.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: protótipos/*/package-lock.json
      # every prototype is its own Vite app: test it, build it and publish it at /prototipo-N/
      # (ASCII URLs), next to the landing page protótipos/index.html
      - name: Build the prototypes
        run: |
          mkdir -p _site
          cp protótipos/index.html _site/index.html
          for dir in protótipos/protótipo_*/; do
            [ -f "$dir/package.json" ] || continue
            n="${dir%/}"; n="${n##*_}"
            echo "::group::protótipo $n"
            (cd "$dir" && npm ci && npm test && npm run build)
            cp -r "$dir/dist" "_site/prototipo-$n"
            echo "::endgroup::"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
